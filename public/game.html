<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>10,000 with Friends!</title>
    <meta name="description" content="An online game of 10,000 (Farkle). Join with a name and play with your friends.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&amp;display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/styles/app.css">
</head>
<body>
    <main class="app-shell">
        <section class="app-card" aria-label="Game table">
            <div data-plugin-particles data-plugin-options='{"density": 160, "color": "#0088cc", "opacity": 1, "hover": {"mode": "bubble", "distance": 250}, "click": {"mode": "repulse", "distance": 400}}'></div>

            <div class="app-toolbar">
                <button type="button" id="copyInvite" class="btn btn-primary btn-sm" data-plugin-tooltip="Copy the link to this game and send it to a friend.">
                    <i class="bi bi-person-plus-fill me-1" aria-hidden="true"></i> Invite
                </button>
                <button type="button" class="btn btn-dark btn-sm" data-drawer-open="rules-drawer" data-plugin-tooltip="Learn to play or review the scoring chart.">
                    <i class="bi bi-list-check me-1" aria-hidden="true"></i> Rules
                </button>
                <button type="button" id="toggleChat" class="btn btn-primary btn-sm" data-drawer-open="chat-drawer" disabled data-plugin-tooltip="Talk with the other players.">
                    <i class="bi bi-chat-dots-fill me-1" aria-hidden="true"></i> Chat <span id="chatUnread" class="badge text-bg-danger ms-1" hidden>0</span>
                </button>
                <a class="btn btn-outline-secondary btn-sm ms-auto" href="/" data-plugin-tooltip="Back to the lobby.">
                    <i class="bi bi-house-door" aria-hidden="true"></i><span class="visually-hidden">Lobby</span>
                </a>
            </div>

</svg></div>
            <hr>

            <div class="app-panel">
                <div class="card">
                    <div class="card-header py-2 small fw-bold"><i class="bi bi-dice-5 me-1" aria-hidden="true"></i> Dice Board <span class="text-body-secondary fw-normal ms-1" id="roomCode"></span></div>
                    <div class="card-body">
                        <div id="start" class="text-center pb-3">
                            <button type="button" class="btn btn-primary join-btn">
                                <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i><span class="label-text">Join</span>
                            </button>
                        </div>

                        <div id="play">
                            <div id="turnStatus" role="status" aria-live="polite"></div>
                            <div class="dice-board">
                                <div id="dice" class="manual" data-plugin-dice></div>
                                <div class="board-buttons">
                                    <button type="button" id="GameStart" class="btn btn-success" hidden>
                                        <i class="bi bi-play-fill" aria-hidden="true"></i><span class="label-text">Start</span>
                                    </button>
                                    <button type="button" id="rollBtn" class="btn btn-primary" hidden disabled>
                                        <i class="bi bi-dice-6" aria-hidden="true"></i><span class="label-text">Roll</span>
                                    </button>
                                    <button type="button" id="Bank" class="btn btn-light border" hidden disabled>
                                        <i class="bi bi-bank" aria-hidden="true"></i><span class="label-text">Bank</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="playersPanel" data-plugin-collapsible data-plugin-options='{"defaultOpen": true}'>
                    <button type="button" class="players-toggle" data-collapsible-trigger>
                        <span class="label-text">Players</span>
                        <i class="bi bi-chevron-down" data-collapsible-chevron aria-hidden="true"></i>
                    </button>
                    <div data-collapsible-content>
                        <div id="PlayerList" class="list-group"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="join-dialog" data-plugin-dialog data-plugin-options='{"animationIn": "zoomIn", "animationOut": "zoomOut"}'>
        <div data-dialog-backdrop></div>
        <div data-dialog-panel class="dialog-sm">
            <form id="join-form" novalidate>
                <h2 class="h5 mb-1" data-dialog-title>Join this game</h2>
                <p class="small text-body-secondary" data-dialog-description>Pick the name the other players will see.</p>
                <label for="join-name" class="form-label">Your name</label>
                <input type="text" id="join-name" class="form-control" maxlength="20" autocomplete="nickname" required data-dialog-autofocus>
                <div class="invalid-feedback">Please enter a name.</div>
                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button type="button" class="btn btn-light" data-dialog-close>Cancel</button>
                    <button type="submit" class="btn btn-primary">Join</button>
                </div>
            </form>
        </div>
    </div>

    <div id="chat-drawer" class="app-drawer manual" data-plugin-drawer data-plugin-options='{"direction": "right"}'>
        <div data-drawer-panel>
            <div class="drawer-head">
                <h2 class="h5" data-drawer-title><i class="bi bi-chat-dots me-1" aria-hidden="true"></i> Chat</h2>
                <button type="button" class="btn-close" data-drawer-close aria-label="Close the chat"></button>
            </div>
            <div id="chatlog" class="chat-log" data-plugin-scroll-shadow aria-live="polite"></div>
            <form id="chat-form" class="input-group mt-2" autocomplete="off">
                <input type="text" id="chatmessage" class="form-control" placeholder="Write a message…" maxlength="500" aria-label="Message">
                <button type="submit" class="btn btn-primary"><i class="bi bi-send-fill me-1" aria-hidden="true"></i> Send</button>
            </form>
        </div>
    </div>

    <div id="rules-drawer" class="app-drawer manual" data-plugin-drawer data-plugin-options='{"direction": "right"}'>
        <div data-drawer-panel>
            <div class="drawer-head">
                <h2 class="h5" data-drawer-title><i class="bi bi-list-check me-1"></i> Rules and Scoring</h2>
                <button type="button" class="btn-close" data-drawer-close aria-label="Close the rules"></button>
            </div>
            <div class="flex-grow-1 overflow-auto pe-2" data-plugin-scroll-shadow data-plugin-scrollbar
               data-plugin-options='{"axis":"y","theme":"inset-3-dark","autoHideScrollbar":true,"scrollInertia":650}'>
                <div class="rules-md" data-plugin-markdown data-plugin-markdown-src="/rules.md">Loading the rules…</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/vendor/themestrap/js/components/themestrap.plugin.tooltip.js"></script>
    <script src="/vendor/themestrap/js/components/themestrap.plugin.drawer.js"></script>
    <script src="/vendor/themestrap/js/components/themestrap.plugin.dialog.js"></script>
    <script src="/vendor/themestrap/js/components/themestrap.plugin.markdown.js"></script>
    <script src="/vendor/themestrap/js/components/themestrap.plugin.scrollshadow.js"></script>
    <script src="/vendor/themestrap/js/components/themestrap.plugin.scrollbar.js"></script>
    <script src="/vendor/themestrap/js/components/themestrap.plugin.collapsible.js"></script>
    <script src="/vendor/themestrap/js/components/themestrap.plugin.dice.js"></script>
    <script src="/vendor/themestrap/js/components/themestrap.plugin.progressbar.js"></script>
    <script src="/vendor/themestrap/js/components/themestrap.plugin.counter.js"></script>
    <script src="/vendor/themestrap/js/components/themestrap.plugin.particles.js"></script>
    <script src="/vendor/themestrap/js/themestrap.init.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/scoring.js"></script>
    <script src="/scripts/app.js"></script>
    <script src="/scripts/main.js"></script>
</body>
</html>
